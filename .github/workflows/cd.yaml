name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: write

# One deploy at a time, in order.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the site
        run: npm run build
        env:
          # Google Analytics runs on the live site only.
          PUBLIC_GA_ID: G-9CR821NBE4

      # GitHub Pages serves the gh-pages branch, as it did for MkDocs: replace it with the new build.
      - name: Publish to the gh-pages branch
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
