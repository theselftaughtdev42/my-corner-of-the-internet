name: Continuous Integration

on:
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint the code
        run: npm run lint

      # Vale's styles were downloaded by `npm ci`. Only errors fail the check.
      - name: Check the prose
        run: npm run lint:prose

      - name: Check the code is formatted
        run: npm run format:check

      - name: Run the unit tests
        run: npm test

      # Type-checks the code, checks every note's front matter, builds the site and its search index,
      # and checks the sitemap and feeds are well formed and only point at built pages, and the sitemap lists them all.
      - name: Build the site
        run: npm run build

      # Every internal link, #anchor, image and asset in the built site must resolve. External links aren't checked.
      - name: Check the links
        run: npm run check:links

      # Every built page must be valid HTML, by html-validate's recommended rules (see .htmlvalidate.mjs).
      - name: Check the HTML
        run: npm run check:html
