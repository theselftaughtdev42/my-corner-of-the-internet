name: Continuous Integration

on:
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint the code
        run: npm run lint

      - name: Check the code is formatted
        run: npm run format:check

      - name: Run the unit tests
        run: npm test

      # Type-checks the code, checks every note's front matter, builds the site and its search index.
      - name: Build the site
        run: npm run build
