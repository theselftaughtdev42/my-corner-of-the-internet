StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Site

Packages = write-good, proselint

[*.md]
BasedOnStyles = Vale, write-good, proselint

# Too noisy for a conversational voice.
write-good.E-Prime = NO
write-good.TooWordy = NO
write-good.So = NO
proselint.But = NO
# write-good.Weasel already flags 'very'.
proselint.Very = NO

# Worth a look, but not wrong.
write-good.Passive = suggestion
write-good.ThereIs = suggestion

# The template's TODOs are there on purpose.
[templates/*.md]
proselint.Annotations = NO
